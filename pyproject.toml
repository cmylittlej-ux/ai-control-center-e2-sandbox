[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-center-kernel"
version = "0.1.0"
description = "Minimal PostgreSQL-authoritative Control Kernel"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["control_kernel*"]
